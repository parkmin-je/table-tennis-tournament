spring:
  application:
    name: pingpong
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    encoding: UTF-8
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**
      cache:
        cachecontrol:
          max-age: 7d
  messages:
    encoding: UTF-8

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  name: 안산시 탁구 협회
  # WebSocket 허용 Origin (쉼표 구분). 비우면 같은 Origin만 허용
  allowed-origins: ${APP_ALLOWED_ORIGINS:}
  security:
    login-max-attempts: 5
    login-lock-minutes: 15
  # 최초 기동 시 관리자 계정이 없으면 생성 (비밀번호가 비어 있으면 생성하지 않음)
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:admin@example.com}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
