<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<head><title th:text="${post == null ? '글쓰기' : '글 수정'}">글쓰기</title></head>
<body>
<div layout:fragment="content" class="container" style="max-width: 860px">
  <div class="page-head">
    <a class="small fw-semibold" th:href="${post == null ? '/board' : '/board/' + post.id}"><i class="bi bi-chevron-left"></i>돌아가기</a>
    <h1 class="mt-1" th:text="${post == null ? '글쓰기' : '글 수정'}">글쓰기</h1>
  </div>
  <form class="panel panel-body" method="post" th:object="${form}"
        th:action="${post == null} ? @{/board/write} : @{/board/{id}/edit(id=${post.id})}">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="category">게시판</label>
        <select class="form-select" id="category" th:field="*{category}">
          <th:block th:each="c : ${categories}">
            <option th:if="${!c.staffOnly}" th:value="${c}" th:text="${c.label}"></option>
            <option sec:authorize="hasRole('STAFF')" th:if="${c.staffOnly}" th:value="${c}" th:text="${c.label}"></option>
          </th:block>
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label" for="title">제목</label>
        <input class="form-control" id="title" th:field="*{title}" th:errorclass="is-invalid" required maxlength="200">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
      </div>
      <div class="col-12">
        <label class="form-label" for="content">내용</label>
        <textarea class="form-control" id="content" rows="14" th:field="*{content}" th:errorclass="is-invalid" required maxlength="10000"></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-primary" type="submit">저장</button>
    </div>
  </form>
</div>
</body>
</html>
