<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<head><title th:text="${post.title}">게시글</title></head>
<body>
<div layout:fragment="content" class="container" style="max-width: 860px">
  <div class="page-head">
    <a class="back-link" th:href="@{/board(category=${post.category})}"><i class="bi bi-chevron-left"></i><span th:text="${post.category.label}"></span></a>
    <h1 class="mt-2" th:text="${post.title}">제목</h1>
    <div class="d-flex flex-wrap gap-3 small text-muted mt-2">
      <span><i class="bi bi-person me-1"></i><span th:text="${post.author.name}"></span></span>
      <span><i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd HH:mm')}"></span></span>
      <span><i class="bi bi-eye me-1"></i><span th:text="${post.viewCount}"></span></span>
    </div>
  </div>

  <article class="panel mb-3">
    <div class="panel-body post-body" th:text="${post.content}">내용</div>
    <div class="panel-body border-top d-flex flex-wrap gap-2 align-items-center">
      <button class="btn btn-soft btn-sm" type="button" th:attr="data-like=@{/board/{id}/like(id=${post.id})}" th:classappend="${liked} ? 'active'">
        <i class="bi" th:classappend="${liked} ? 'bi-heart-fill' : 'bi-heart'"></i> 좋아요 <span data-like-count th:text="${post.likeCount}">0</span>
      </button>
      <div class="ms-auto d-flex gap-2">
        <form sec:authorize="hasRole('STAFF')" th:action="@{/board/{id}/pin(id=${post.id})}" method="post">
          <button class="btn btn-ghost btn-sm" type="submit" th:text="${post.pinned ? '고정 해제' : '상단 고정'}">고정</button>
        </form>
        <a class="btn btn-soft btn-sm" th:if="${canEdit}" th:href="@{/board/{id}/edit(id=${post.id})}">수정</a>
        <form th:if="${canEdit}" th:action="@{/board/{id}/delete(id=${post.id})}" method="post" data-confirm="글을 삭제할까요?">
          <button class="btn btn-danger-outline btn-sm" type="submit">삭제</button>
        </form>
      </div>
    </div>
  </article>

  <section class="panel" id="comments">
    <div class="panel-head"><h2>댓글 <span class="text-muted fw-normal" th:text="${comments.size()}"></span></h2></div>
    <div class="panel-body">
      <th:block th:if="${comments.isEmpty()}"><p class="text-muted small mb-3">첫 댓글을 남겨 보세요.</p></th:block>
      <div class="comment" th:each="c : ${comments}">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="fw-semibold" th:text="${c.author.name}"></span>
          <span class="entry-sub" th:text="${#temporals.format(c.createdAt, 'MM.dd HH:mm')}"></span>
          <form class="ms-auto" th:if="${currentUser != null and (c.isWrittenBy(currentUser) or currentUser.staff)}"
                th:action="@{/board/comments/{id}/delete(id=${c.id})}" method="post" data-confirm="댓글을 삭제할까요?">
            <button class="btn btn-danger-outline btn-xs" type="submit">삭제</button>
          </form>
        </div>
        <div class="pre-wrap" th:text="${c.content}"></div>
      </div>
      <form class="mt-3" sec:authorize="isAuthenticated()" th:action="@{/board/{id}/comments(id=${post.id})}" method="post">
        <textarea class="form-control mb-2" name="content" rows="3" maxlength="1000" required placeholder="댓글을 입력하세요"></textarea>
        <div class="d-flex justify-content-end"><button class="btn btn-primary btn-sm" type="submit">댓글 등록</button></div>
      </form>
      <p class="small text-muted mt-3 mb-0" sec:authorize="!isAuthenticated()"><a th:href="@{/user/login}">로그인</a>하면 댓글을 남길 수 있습니다.</p>
    </div>
  </section>
</div>
</body>
</html>
