<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <meta name="description" content="생활체육 탁구 대회 접수·대진·실시간 결과">
  <meta name="theme-color" content="#15181d">
  <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE" th:text="${appName ?: '탁구 대회'}">탁구 대회</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="manifest" th:href="@{/manifest.json}">
  <script th:src="@{/js/theme.js}"></script>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendor/icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#main">본문 바로가기</a>

<nav class="navbar navbar-expand-lg app-nav">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13" cy="13" r="10.5" fill="#d42a1f"/>
        <circle cx="13" cy="13" r="10.5" fill="none" stroke="#f4f6f4" stroke-width="1.5"/>
        <rect x="18.5" y="19" width="5" height="11" rx="2.2" transform="rotate(-45 21 24.5)" fill="#f4f6f4"/>
        <circle cx="26.5" cy="6" r="3.2" fill="#ffe45c"/>
      </svg>
      <span th:text="${appName}">탁구 대회</span>
    </a>
    <div class="d-flex align-items-center gap-2 order-lg-last ms-auto ms-lg-0">
      <button class="search-trigger d-none d-xl-flex" type="button" data-search-open>
        <i class="bi bi-search"></i> 대회, 선수 찾기 <kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn d-xl-none" type="button" data-search-open aria-label="검색"><i class="bi bi-search"></i></button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드 전환"><i class="bi bi-circle-half"></i></button>
      <th:block sec:authorize="isAuthenticated()">
        <a class="icon-btn" th:href="@{/notifications}" aria-label="알림">
          <i class="bi bi-bell"></i>
          <span class="count" data-unread th:with="uc=${unreadCount ?: 0}" th:text="${uc > 99 ? '99+' : uc}" th:hidden="${uc == 0}">0</span>
        </a>
        <div class="dropdown">
          <button class="icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="내 메뉴">
            <i class="bi bi-person"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="px-2 py-1"><div class="fw-bold" th:text="${me?.name}">이름</div><div class="entry-sub" th:text="${me?.role?.label}">회원</div></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" th:href="@{/me}"><i class="bi bi-person-badge me-2"></i>내 정보</a></li>
            <li><a class="dropdown-item" th:href="@{/me/player}"><i class="bi bi-person-vcard me-2"></i>선수 프로필</a></li>
            <li sec:authorize="hasRole('STAFF')"><hr class="dropdown-divider"></li>
            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>관리자</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/tournaments}"><i class="bi bi-trophy me-2"></i>대회 관리</a></li>
            <li sec:authorize="hasRole('STAFF')"><a class="dropdown-item" th:href="@{/manage/players/new}"><i class="bi bi-person-plus me-2"></i>선수 등록</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form th:action="@{/user/logout}" method="post">
                <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right me-2"></i>로그아웃</button>
              </form>
            </li>
          </ul>
        </div>
      </th:block>
      <span class="nav-auth d-flex gap-2" sec:authorize="!isAuthenticated()">
        <a class="btn btn-soft btn-sm d-none d-sm-inline-block" th:href="@{/user/login}">로그인</a>
        <a class="btn btn-primary btn-sm" th:href="@{/user/signup}">회원가입</a>
      </span>
      <button class="navbar-toggler border-0 px-1" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="메뉴">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-lg-4 me-auto gap-lg-1 py-2 py-lg-0" data-main-nav>
        <li class="nav-item"><a class="nav-link" th:href="@{/tournaments}"><i class="bi bi-trophy me-1"></i>대회</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/ranking}"><i class="bi bi-bar-chart-line me-1"></i>랭킹</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/players}"><i class="bi bi-people me-1"></i>선수</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/clubs}"><i class="bi bi-house-heart me-1"></i>클럽</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/calendar}"><i class="bi bi-calendar3 me-1"></i>일정</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/board}"><i class="bi bi-chat-square-text me-1"></i>게시판</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="flash-stack" aria-live="polite">
  <div class="flash flash-success" data-autohide th:if="${success}">
    <i class="bi bi-check-circle-fill"></i><div th:text="${success}"></div>
    <button type="button" class="btn-close" aria-label="닫기"></button>
  </div>
  <div class="flash flash-info" data-autohide th:if="${info}">
    <i class="bi bi-info-circle-fill"></i><div th:text="${info}"></div>
    <button type="button" class="btn-close" aria-label="닫기"></button>
  </div>
  <div class="flash flash-error" th:if="${flashError}">
    <i class="bi bi-exclamation-triangle-fill"></i><div th:text="${flashError}"></div>
    <button type="button" class="btn-close" aria-label="닫기"></button>
  </div>
</div>

<main id="main">
  <div layout:fragment="content"></div>
</main>

<footer class="app-footer">
  <div class="container d-flex flex-wrap gap-3 justify-content-between">
    <span><span th:text="${appName}"></span>, <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span></span>
    <span class="d-flex gap-3">
      <a class="text-faint" th:href="@{/tournaments}">대회</a>
      <a class="text-faint" th:href="@{/board(category='NOTICE')}">공지사항</a>
      <a class="text-faint" th:href="@{/calendar}">일정</a>
    </span>
  </div>
</footer>

<div class="modal fade search-modal" id="searchModal" tabindex="-1" aria-label="검색">
  <div class="modal-dialog modal-dialog-scrollable mt-5">
    <div class="modal-content">
      <div class="d-flex align-items-center px-3">
        <i class="bi bi-search text-faint"></i>
        <input class="form-control search-input" type="search" placeholder="대회명 또는 선수 이름" autocomplete="off" maxlength="50">
      </div>
      <div class="search-results"></div>
    </div>
  </div>
</div>

<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
