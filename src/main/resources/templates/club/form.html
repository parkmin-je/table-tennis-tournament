<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${club == null ? '클럽 등록' : '클럽 수정'}">클럽</title></head>
<body>
<div layout:fragment="content" class="container" style="max-width: 640px">
  <div class="page-head">
    <a class="small fw-semibold" th:href="${club == null ? '/clubs' : '/club/' + club.id}"><i class="bi bi-chevron-left"></i>돌아가기</a>
    <h1 class="mt-1" th:text="${club == null ? '클럽 등록' : '클럽 수정'}">클럽</h1>
  </div>
  <form class="panel panel-body" method="post" th:object="${form}"
        th:action="${club == null} ? @{/manage/clubs/new} : @{/manage/clubs/{id}/edit(id=${club.id})}">
    <div th:replace="~{fragments/ui :: globalErrors}"></div>
    <div class="mb-3">
      <label class="form-label" for="name">클럽명</label>
      <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" required maxlength="100">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="region">지역</label>
      <input class="form-control" id="region" th:field="*{region}" maxlength="100" placeholder="예: 경기 안산시 단원구">
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">소개</label>
      <textarea class="form-control" id="description" rows="4" th:field="*{description}" maxlength="1000" placeholder="연습 시간, 장소 등"></textarea>
    </div>
    <div class="d-flex justify-content-end"><button class="btn btn-primary" type="submit">저장</button></div>
  </form>
</div>
</body>
</html>
