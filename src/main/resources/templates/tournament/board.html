<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-force-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${t.title + ' · 현황판'}">현황판</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <script th:src="@{/js/theme.js}"></script>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendor/icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="tv" th:attr="data-live-tournament=${t.id}">
  <header class="tv-head">
    <div>
      <div class="small fw-bold text-white-50" th:text="${t.status.label + ' · ' + (t.venue ?: '')}">진행중</div>
      <h1 th:text="${t.title}">대회명</h1>
    </div>
    <div style="min-width: 220px" data-fragment="progress"><div th:replace="~{tournament/fragments :: progress}"></div></div>
    <div class="clock" data-clock>--:--</div>
    <div class="d-flex flex-column align-items-end gap-1">
      <span class="tv-conn" data-conn><span class="conn-dot"></span><span data-conn-label>연결 중…</span></span>
      <button class="btn btn-sm btn-outline-light" type="button" data-fullscreen><i class="bi bi-fullscreen"></i></button>
    </div>
  </header>
  <div data-fragment="board"><div th:replace="~{tournament/fragments :: board}"></div></div>
  <div class="flash-stack"></div>
  <script th:src="@{/js/app.js}"></script>
  <script th:src="@{/vendor/stomp/stomp.umd.min.js}"></script>
  <script th:src="@{/js/live.js}"></script>
</body>
</html>
