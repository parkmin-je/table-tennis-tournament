<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${t.title + ' 대진표'}">대진표</title></head>
<body>
<div layout:fragment="content" class="container-fluid px-3 px-lg-4" th:attr="data-live-tournament=${board.live ? t.id : null}">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <a class="back-link no-print" th:href="@{/tournament/{id}(id=${t.id})}"><i class="bi bi-chevron-left"></i>대회 정보</a>
      <h1 class="mt-1" th:text="${t.title}">대회</h1>
      <p class="lead" th:text="${#temporals.format(t.startAt, 'yyyy.M.d (E)') + ', ' + (t.venue ?: '') + ', ' + t.bestOfLabel}"></p>
    </div>
    <div class="d-flex gap-2 no-print align-items-center">
      <span class="tv-conn" data-conn th:if="${board.live}"><span class="conn-dot"></span><span data-conn-label>연결 중…</span></span>
      <button class="btn btn-soft btn-sm" type="button" data-print><i class="bi bi-printer me-1"></i>인쇄</button>
    </div>
  </div>

  <section class="mb-4" th:if="${t.hasGroupStage()}">
    <h2 class="h5 fw-bold mb-3">예선 리그</h2>
    <div data-fragment="groups"><div th:replace="~{tournament/fragments :: groups}"></div></div>
  </section>

  <section>
    <h2 class="h5 fw-bold mb-3">본선 토너먼트</h2>
    <div data-fragment="bracket"><div th:replace="~{tournament/fragments :: bracket}"></div></div>
  </section>
</div>
<th:block layout:fragment="scripts">
  <script th:if="${board.live}" th:src="@{/vendor/stomp/stomp.umd.min.js}"></script>
  <script th:src="@{/js/live.js}"></script>
</th:block>
</body>
</html>
