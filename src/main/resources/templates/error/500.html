<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>일시적인 오류가 발생했습니다</title></head>
<body>
<div layout:fragment="content" class="container py-5 text-center" style="max-width: 560px">
  <div class="display-4 fw-black text-faint mb-2">500</div>
  <h1 class="h4 fw-bold mb-2">일시적인 오류가 발생했습니다</h1>
  <p class="text-muted mb-4" th:text="${#strings.isEmpty(message) ? '잠시 후 다시 시도해 주세요. 문제가 계속되면 운영진에게 알려 주세요.' : message}">잠시 후 다시 시도해 주세요. 문제가 계속되면 운영진에게 알려 주세요.</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" th:href="@{/}">홈으로</a>
    <a class="btn btn-soft" th:href="@{/tournaments}">대회 목록</a>
  </div>
</div>
</body>
</html>
