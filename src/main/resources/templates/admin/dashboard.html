<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>관리자</title></head>
<body>
<div layout:fragment="content" class="container">
  <div class="page-head d-flex flex-wrap justify-content-between align-items-end gap-2">
    <div><h1>관리자 대시보드</h1></div>
    <div class="d-flex gap-2">
      <a class="btn btn-soft" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>회원·권한</a>
      <a class="btn btn-soft" th:href="@{/manage/clubs/new}"><i class="bi bi-house-add me-1"></i>클럽 등록</a>
      <a class="btn btn-primary" th:href="@{/admin/tournaments/new}"><i class="bi bi-plus-lg me-1"></i>대회 만들기</a>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-lg"><div class="panel stat"><div class="label">회원</div><div class="value tnum" th:text="${userCount}">0</div></div></div>
    <div class="col-6 col-lg"><div class="panel stat"><div class="label">선수</div><div class="value tnum" th:text="${playerCount}">0</div></div></div>
    <div class="col-4 col-lg"><div class="panel stat"><div class="label">접수 중</div><div class="value tnum" th:text="${recruiting}">0</div></div></div>
    <div class="col-4 col-lg"><div class="panel stat"><div class="label">진행 중</div><div class="value tnum text-danger" th:text="${inProgress}">0</div></div></div>
    <div class="col-4 col-lg"><div class="panel stat"><div class="label">종료</div><div class="value tnum" th:text="${completed}">0</div></div></div>
  </div>

  <div class="row g-4">
    <div class="col-lg-7">
      <section class="panel">
        <div class="panel-head"><h2>대회</h2><a class="back-link" th:href="@{/admin/tournaments}">전체</a></div>
        <th:block th:if="${tournaments.isEmpty()}"><div th:replace="~{fragments/ui :: empty('bi-trophy', '대회가 없습니다.')}"></div></th:block>
        <a class="list-row" th:each="t : ${tournaments}" th:href="@{/manage/tournaments/{id}(id=${t.id})}">
          <div th:replace="~{fragments/ui :: dateChip(${t.startAt})}"></div>
          <div class="min-w-0 flex-grow-1">
            <div class="fw-semibold truncate" th:text="${t.title}"></div>
            <div class="entry-sub" th:text="${t.format.label + ', ' + t.entryType.label}"></div>
          </div>
          <span th:replace="~{fragments/ui :: status(${t.status})}"></span>
        </a>
      </section>
    </div>
    <div class="col-lg-5">
      <section class="panel">
        <div class="panel-head"><h2>최근 참가 신청</h2></div>
        <th:block th:if="${recentEntries.isEmpty()}"><div th:replace="~{fragments/ui :: empty('bi-inbox', '신청 내역이 없습니다.')}"></div></th:block>
        <a class="list-row" th:each="e : ${recentEntries}" th:href="@{/manage/tournaments/{id}(id=${e.tournament.id})}">
          <span class="avatar" th:text="${#strings.substring(e.player.name, 0, 1)}">김</span>
          <div class="min-w-0 flex-grow-1">
            <div class="fw-semibold truncate" th:text="${e.displayName}"></div>
            <div class="entry-sub truncate" th:text="${e.tournament.title}"></div>
          </div>
          <span th:replace="~{fragments/ui :: status(${e.status})}"></span>
        </a>
      </section>
    </div>
  </div>
</div>
</body>
</html>
