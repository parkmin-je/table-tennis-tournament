<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>비밀번호 변경</title></head>
<body>
<div layout:fragment="content" class="container py-4" style="max-width: 480px">
  <a class="back-link" th:href="@{/me}"><i class="bi bi-chevron-left"></i>내 정보</a>
  <h1 class="h4 fw-black mt-2 mb-4">비밀번호 변경</h1>
  <form class="panel panel-body d-grid gap-3" th:action="@{/me/password}" method="post" th:object="${form}">
    <div th:replace="~{fragments/ui :: globalErrors}"></div>
    <div>
      <label class="form-label" for="current">현재 비밀번호</label>
      <input class="form-control" type="password" id="current" th:field="*{current}" required autocomplete="current-password">
    </div>
    <div>
      <label class="form-label" for="next">새 비밀번호</label>
      <input class="form-control" type="password" id="next" th:field="*{next}" th:errorclass="is-invalid" required autocomplete="new-password">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('next')}" th:errors="*{next}"></div>
    </div>
    <div>
      <label class="form-label" for="confirm">새 비밀번호 확인</label>
      <input class="form-control" type="password" id="confirm" th:field="*{confirm}" th:errorclass="is-invalid" required autocomplete="new-password">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}"></div>
    </div>
    <button class="btn btn-primary" type="submit">변경</button>
  </form>
</div>
</body>
</html>
