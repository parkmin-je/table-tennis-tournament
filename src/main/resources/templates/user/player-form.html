<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>선수 프로필</title></head>
<body>
<div layout:fragment="content" class="container py-4" style="max-width: 560px">
  <a class="back-link" th:href="@{/me}"><i class="bi bi-chevron-left"></i>내 정보</a>
  <h1 class="h4 fw-black mt-2 mb-1">내 선수 프로필</h1>
  <p class="small text-muted mb-4">대회 참가 자격(성별·부수) 확인과 조 편성(같은 클럽 분산)에 사용됩니다. 이름은 회원 이름이 그대로 쓰입니다.</p>
  <form class="panel panel-body d-grid gap-3" th:action="@{/me/player}" method="post" th:object="${form}">
    <div>
      <label class="form-label">성별</label>
      <div class="choice-grid" style="grid-template-columns: 1fr 1fr">
        <div class="choice" th:each="g : ${genders}">
          <input type="radio" th:id="${'g-' + g}" th:field="*{gender}" th:value="${g}" required>
          <label th:for="${'g-' + g}"><strong th:text="${g.label}"></strong></label>
        </div>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-6">
        <label class="form-label" for="division">부수</label>
        <select class="form-select" id="division" th:field="*{division}">
          <option value="">모름 / 미정</option>
          <option th:each="d : ${#numbers.sequence(1, 9)}" th:value="${d}" th:text="${d + '부'}"></option>
        </select>
        <div class="form-text">부수 제한 대회는 부수가 있어야 신청할 수 있습니다.</div>
      </div>
      <div class="col-6">
        <label class="form-label" for="birthYear">출생연도</label>
        <input class="form-control" type="number" id="birthYear" th:field="*{birthYear}" min="1920" max="2025" placeholder="선택">
      </div>
    </div>
    <div>
      <label class="form-label" for="clubId">소속 클럽</label>
      <select class="form-select" id="clubId" th:field="*{clubId}">
        <option value="">무소속</option>
        <option th:each="c : ${clubs}" th:value="${c.id}" th:text="${c.name + (c.region != null ? ', ' + c.region : '')}"></option>
      </select>
      <div class="form-text">클럽이 목록에 없으면 운영진에게 등록을 요청하세요.</div>
    </div>
    <div>
      <label class="form-label" for="phone">연락처</label>
      <input class="form-control" id="phone" th:field="*{phone}" maxlength="30" placeholder="선택 · 운영진만 확인">
    </div>
    <button class="btn btn-primary" type="submit">저장</button>
  </form>
</div>
</body>
</html>
