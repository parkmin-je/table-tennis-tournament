<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>회원가입</title></head>
<body>
<div layout:fragment="content" class="container py-5" style="max-width: 480px">
  <h1 class="h4 fw-black text-center mb-4">회원가입</h1>
  <form class="panel panel-body d-grid gap-3" th:action="@{/user/signup}" method="post" th:object="${form}">
    <div th:replace="~{fragments/ui :: globalErrors}"></div>
    <div>
      <label class="form-label" for="username">아이디</label>
      <input class="form-control" id="username" th:field="*{username}" th:errorclass="is-invalid" required autocomplete="username" maxlength="20">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      <div class="form-text" th:unless="${#fields.hasErrors('username')}">영문·숫자·밑줄 4~20자</div>
    </div>
    <div>
      <label class="form-label" for="name">이름 (실명)</label>
      <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" required maxlength="20">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      <div class="form-text" th:unless="${#fields.hasErrors('name')}">대진표에 표시되는 이름입니다.</div>
    </div>
    <div>
      <label class="form-label" for="email">이메일</label>
      <input class="form-control" type="email" id="email" th:field="*{email}" th:errorclass="is-invalid" required autocomplete="email" maxlength="120">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div>
      <label class="form-label" for="password">비밀번호</label>
      <input class="form-control" type="password" id="password" th:field="*{password}" th:errorclass="is-invalid" required autocomplete="new-password">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      <div class="form-text" th:unless="${#fields.hasErrors('password')}">영문·숫자·특수문자 포함 8자 이상</div>
    </div>
    <div>
      <label class="form-label" for="passwordConfirm">비밀번호 확인</label>
      <input class="form-control" type="password" id="passwordConfirm" th:field="*{passwordConfirm}" th:errorclass="is-invalid" required autocomplete="new-password">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
    </div>
    <button class="btn btn-primary btn-lg" type="submit">가입하기</button>
  </form>
  <p class="text-center small text-muted mt-3">이미 회원이신가요? <a th:href="@{/user/login}">로그인</a></p>
</div>
</body>
</html>
