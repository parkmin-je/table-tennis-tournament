<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${player == null ? '선수 등록' : '선수 수정'}">선수</title></head>
<body>
<div layout:fragment="content" class="container" style="max-width: 640px">
  <div class="page-head">
    <a class="back-link" th:href="${player == null ? '/players' : '/player/' + player.id}"><i class="bi bi-chevron-left"></i>돌아가기</a>
    <h1 class="mt-1" th:text="${player == null ? '선수 등록' : '선수 수정'}">선수</h1>
    <p class="lead" th:if="${player == null}">회원가입하지 않은 선수(현장 접수 등)를 등록합니다. 회원은 '내 선수 프로필'에서 직접 등록합니다.</p>
    <p class="lead" th:if="${player != null and player.user != null}">회원과 연결된 선수입니다. 이름은 회원 정보를 따릅니다.</p>
  </div>
  <form class="panel panel-body" method="post" th:object="${form}"
        th:action="${player == null} ? @{/manage/players/new} : @{/manage/players/{id}/edit(id=${player.id})}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="name">이름</label>
        <input class="form-control" id="name" th:field="*{name}" required maxlength="50">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="gender">성별</label>
        <select class="form-select" id="gender" th:field="*{gender}" required>
          <option th:each="g : ${genders}" th:value="${g}" th:text="${g.label}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="division">부수</label>
        <select class="form-select" id="division" th:field="*{division}">
          <option value="">미정</option>
          <option th:each="d : ${#numbers.sequence(1, 9)}" th:value="${d}" th:text="${d + '부'}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="birthYear">출생연도</label>
        <input class="form-control" type="number" id="birthYear" th:field="*{birthYear}" min="1920" max="2025" placeholder="예: 1985">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="clubId">클럽</label>
        <select class="form-select" id="clubId" th:field="*{clubId}">
          <option value="">무소속</option>
          <option th:each="c : ${clubs}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="phone">연락처</label>
        <input class="form-control" id="phone" th:field="*{phone}" maxlength="30" placeholder="운영진만 볼 수 있습니다">
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button class="btn btn-primary" type="submit">저장</button>
    </div>
  </form>
</div>
</body>
</html>
